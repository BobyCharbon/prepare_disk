# Publie une version quand on pousse un tag "v1.2.3" (voir release.sh).
name: Publier une version
on:
  push:
    tags: ['v*']
  workflow_dispatch:   # bouton « Run workflow » : publie la version du fichier VERSION
permissions:
  contents: write
jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Installer le certificat Developer ID
        env:
          DEVELOPER_ID_P12: ${{ secrets.DEVELOPER_ID_P12 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          KC="$RUNNER_TEMP/signing.keychain-db"
          echo "$DEVELOPER_ID_P12" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security create-keychain -p ci "$KC"
          security set-keychain-settings "$KC"
          security unlock-keychain -p ci "$KC"
          security import "$RUNNER_TEMP/signing.p12" -k "$KC" -P "$DEVELOPER_ID_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/signing.p12"

      - name: Compiler, signer et notariser
        env:
          NOTARIZE: "1"
          NOTARY_KEY: ${{ secrets.NOTARY_KEY }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER }}
        run: |
          echo "$NOTARY_KEY" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          NOTARY_KEY_PATH="$RUNNER_TEMP/notary.p8" ./build_app.sh "$(cat VERSION)"
          rm "$RUNNER_TEMP/notary.p8"

      - name: Vérifier la signature et la notarisation
        run: |
          codesign --verify --deep --strict '-R=identifier "com.bobycharbon.preparedisk" and anchor apple generic and certificate leaf[subject.OU] = "GS2B6GA9JA"' "Prepare Disk.app"
          spctl -a -vvv -t exec "Prepare Disk.app"

      - name: Publier
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(cat VERSION)"
          # Notes de la version : la section "## $VERSION — date" du CHANGELOG.
          awk -v v="$VERSION" '/^## /{p = ($2 == v); next} p' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "Pas de section ## $VERSION dans CHANGELOG.md"; exit 1; }
          DATE=$(grep -m1 "^## $VERSION " CHANGELOG.md | sed 's/^## [^ ]* — //')
          gh release create "v$VERSION" PrepareDisk.zip "PrepareDisk-$VERSION.zip" \
            --title "v$VERSION — $DATE" --notes-file notes.md
